# The grounds: one Chromium playing whatever the arena assigns it.
#
# Its own service rather than a fourth container beside the arena, for two
# reasons that both matter. A browser holding a venue's football is the thing
# most likely to need replacing on its own, and a container in the arena's
# instance cannot be: the whole instance goes. And the arena's three containers
# already ask for 8 vCPU, which is the ceiling for one Cloud Run instance, so
# there is no CPU left there to play in.
#
# The placeholders are rendered by deploy/deploy.sh, the same way service.yaml's
# are. __ARENA_URL__ is not a name you set: deploy.sh reads it off the arena it
# replaced a step earlier, which is why the grounds are deployed second.
#
#   deploy/deploy.sh          # renders this and replaces the service
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: grounds
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Five instances, a hundred pitches. Three and sixty was the first step
        # past the spec's fifty; a hundred is where the venue was taken next,
        # and it is the same dial. This is the scale-out the note here used to
        # defer, and unlike the arena's `maxScale: "1"` it is a number rather
        # than a correctness constraint: nothing in a grounds is shared with
        # another one. Each launches its own browser, holds its own control
        # socket, and is told by the arena which matches are its own.
        #
        # What made this safe was already here. `Grounds.assign` records one
        # socket per room in `_where` and hands each new match to the emptiest
        # instance that has room, so two instances cannot both be given the
        # same match to run -- `test_the_emptiest_instance_takes_the_next_match`
        # and `test_an_assignment_goes_to_the_instance_with_room` are that
        # rule. The old note here worried about a second socket "offering the
        # same pitches, and nothing downstream would tell the two apart"; the
        # registry tells them apart by the socket, and nothing else ever needs
        # to. No instance is addressed by anything: each dials the arena out
        # over the public URL and is known by the connection it arrives on.
        #
        # Why five and not one big one: the measurement below. A page is
        # single-threaded and the ceiling is a thread rather than the four vCPU
        # allocated, so even fifty matches is past what any single instance can
        # be bought. Five at twenty is five threads at about 0.55 each, and
        # `GROUNDS_CAPACITY` stays at the twenty that was measured rather than
        # being raised to save an instance -- that number is a promise about one
        # thread, and the way to break it is quietly, by slowing every match in
        # the venue together.
        #
        # An instance that dies takes its own matches with it and the sweep
        # abandons them -- see `Grounds.left`. At one instance that was the
        # whole venue; at five it is a fifth of it, which is the other thing
        # scaling out buys. It does not buy the venue a spare: five at twenty
        # holds a hundred exactly, so a full venue that loses one is twenty
        # matches gone and every kick-off refused until something finishes.
        # Slack is a sixth instance, all evening; see deploy/README.md.
        autoscaling.knative.dev/minScale: "5"
        autoscaling.knative.dev/maxScale: "5"
        # Load-bearing in a way it is not even for the arena. The only requests
        # this service takes are its own health checks, and everything it does
        # happens between them: throttled, it would stop playing football the
        # moment nobody asked it whether it was alive.
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        # Chromium. The first-generation sandbox is a gVisor syscall surface a
        # browser does not fit through, and what that looks like is a launch
        # that hangs rather than an error naming the environment. gen2 is also
        # what makes --disable-dev-shm-usage's alternative available, though
        # the flag is set anyway.
        run.googleapis.com/execution-environment: gen2
      # No VPC interface. The database is the arena's business and this service
      # has none of its own; the arena is reached over the internet by the same
      # public URL a phone uses, carrying the service token in a header.
    spec:
      # Nothing but health checks arrive here, so the default would do. Written
      # down because the number that matters is on the other side: this service
      # opens one outbound socket per match to the arena, and it is the arena's
      # containerConcurrency that has to clear a full venue.
      containerConcurrency: 10
      # Its own account, holding one secret and nothing else. The arena's would
      # have worked and it also carries roles/aiplatform.user, which is a
      # Vertex token mintable from the metadata server by anything running in
      # this instance - and what runs in this instance is a web browser. See
      # deploy/README.md for the two role bindings.
      serviceAccountName: futsal-grounds@__PROJECT__.iam.gserviceaccount.com

      containers:
        - name: grounds
          image: __REGION__-docker.pkg.dev/__PROJECT__/futsal/grounds:__TAG__
          ports:
            - name: http1
              containerPort: 8004
          # The football is one thread - one page, one renderer - so this is not
          # four times one match's worth of anything. It is that thread never
          # queueing behind Chromium's own processes, the Python holding the
          # control socket, and a garbage collection that would otherwise be a
          # dropped frame in every match at once. GROUNDS_CAPACITY below is
          # measured against this size and means nothing away from it.
          #
          # Both numbers were measured on the deployed instance rather than
          # reasoned about, twice, at two different loads:
          #
          #   23 matches   CPU 0.149   memory 0.34 of 4Gi   (1.36 GiB)
          #   15 matches   CPU 0.12    memory 0.061 of 8Gi  (0.49 GiB)
          #   idle         CPU 0.007   memory 0.63 GiB
          #
          # Read the CPU column against one thread, not against four vCPU. Cloud
          # Run divides by everything allocated, so a saturated single thread of
          # a 4-vCPU instance reads as 25% and never more. 0.149 is that thread
          # at three fifths of the only core it can use. The two loads give
          # roughly 0.017 vCPU a match over a fifth of a core of overhead, which
          # puts the capacity ceiling of twenty at about 0.55 vCPU and the spec's
          # fifty just past a whole one. Fifty is therefore not a number this
          # file can buy: a fifth vCPU is a fifth place a single-threaded page
          # cannot run. It is scale-out, which is the `maxScale` note above.
          #
          # The memory column is the answer to "should this be raised", and it
          # is no. Twenty matches - the most this instance will ever be offered,
          # by GROUNDS_CAPACITY below - sits comfortably under 1.5 GiB, so 4Gi is
          # about three times what the ceiling costs. It was briefly deployed at
          # 8Gi on an extrapolation that turned out to be wrong: the reading it
          # rested on was a long-lived instance idling after the rehearsal with
          # its heap not yet returned, mistaken for load. A second measurement on
          # a fresh instance is what these two rows are.
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
          env:
            # Rendered from the arena this deploy just replaced. A grounds
            # pointed at the wrong arena connects, offers its pitches and plays
            # nothing: the arena being kicked off in has no grounds, so every
            # kick-off there answers 503.
            - name: ARENA_URL
              value: __ARENA_URL__
            # How many matches this instance offers to run. A promise about CPU:
            # past it the arena refuses kick-off rather than letting every match
            # in the venue slow down together.
            #
            # Measured on this instance, not guessed and not carried over from
            # the laptop: the capacity rehearsal held 23 concurrent matches here
            # with the slowest at 9.6 Hz and its clock at 0.99x - no strain at
            # all, and no ceiling found. Twenty sits under the largest number
            # actually demonstrated, because the two ways of being wrong are not
            # the same size. Too low refuses a kick-off and says so. Too high
            # slows every match in the venue together, which is the one failure
            # nobody watching a tile on a wall can see.
            #
            # Raising it to reach the spec's fifty would be a guess. Fifty is
            # scale-out, and scale-out is the `maxScale` note above.
            - name: GROUNDS_CAPACITY
              value: "20"
            # The one credential this service has, and the same secret the arena
            # reads. A different one is a control socket closed with 4403 and an
            # instance retrying forever against a token that will never work.
            - name: ARENA_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: arena-service-token, key: latest}
          # Both probes ask the one route there is. It answers 503 until there
          # is a page to play in, which is what makes the startup probe wait for
          # Chromium and the arena's bundle rather than for a socket to accept.
          #
          # 40 x 3s. A browser launch is seconds; the budget is for the arena,
          # whose own revision went ready a step ago and whose first request
          # here is a cold one.
          startupProbe:
            httpGet: {path: /healthz, port: 8004}
            periodSeconds: 3
            failureThreshold: 40
          # The half that matters after the deploy. A page that has crashed took
          # its matches with it either way, and nothing else would notice: the
          # instance stays up, keeps being offered matches, and refuses every
          # one of them for the rest of the evening. This is what makes it a
          # fresh instance instead.
          livenessProbe:
            httpGet: {path: /healthz, port: 8004}
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
