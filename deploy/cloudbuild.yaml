# The three images, built where they will run.
#
# Not built on the laptop. This is an Apple Silicon Mac and Cloud Run is amd64,
# so a local build is either the wrong architecture or an emulated one, and an
# emulated `npm ci` plus three `uv sync`s is slow enough that people stop doing
# it. Cloud Build is amd64 natively and already holds the credentials for the
# push, which is the other thing a local build would have to be taught.
#
# Invoked by deploy/deploy.sh, which passes the repository and the tag.

# The three run at once - `waitFor: ['-']` is the whole of it - because nothing
# here depends on anything else here. The pitch's `npm ci` makes the arena the
# long pole, so the other two are free.
steps:
  - id: arena
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'arena/Dockerfile', '-t', '${_REPO}/arena:${_TAG}', '.']

  - id: coach
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'game/Dockerfile.coach', '-t', '${_REPO}/coach:${_TAG}', '.']

  - id: captain
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'game/Dockerfile.captain', '-t', '${_REPO}/captain:${_TAG}', '.']

# Pushed by Cloud Build on success, so a build that fails halfway leaves no
# half-tagged repository behind for the deploy to pick up.
images:
  - '${_REPO}/arena:${_TAG}'
  - '${_REPO}/coach:${_TAG}'
  - '${_REPO}/captain:${_TAG}'

# The default is 600s and three images with an `npm ci` in one of them will
# exceed it, at which point the build is cancelled rather than failed and the
# log says nothing about why.
timeout: 1800s

options:
  # The default pool is one vCPU, which leaves the pitch build as the long pole
  # by a wide margin. Eight makes the three concurrent steps actually concurrent.
  machineType: E2_HIGHCPU_8
