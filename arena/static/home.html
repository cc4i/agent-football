<!doctype html>
<html lang="en" class="phone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<title>Your dugout - Futsal WorldCup</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="phone">
<div class="pscreen">
  <div class="pbar">
    <span class="eyebrow brand"><b>F</b><b>u</b><b>t</b><b>s</b><b>a</b><b>l</b> <b>W</b><b>o</b><b>r</b><b>l</b><b>d</b><b>C</b><b>u</b><b>p</b></span>
    <a class="linky" href="/register">Change name</a>
  </div>

  <h1 class="ptitle" id="who">&nbsp;</h1>
  <p class="psub" id="standing">Looking you up…</p>

  <p class="recovery-code-home" id="recovery-code" hidden>
    Recovery code: <b class="mono" id="code-value"></b>
  </p>

  <p class="problem" id="problem" hidden></p>

  <!-- A match this phone walked away from. First, because somebody whose squad
       is on a pitch right now is not here to browse. -->
  <a class="resume" id="resume" href="/play" hidden>
    <span>
      <span class="eyebrow">Your match is still on</span>
      <b>Back to your dugout</b>
    </span>
    <span class="code mono" id="resume-code">····</span>
  </a>

  <div class="stack">
    <span class="eyebrow">Rooms open now</span>
    <div class="rooms" id="rooms"></div>

    <!-- The second door, and it lives here rather than at the foot of the page
         because it is an answer to the same question the list above answers.
         A screen holds one room and opens its next only when the match on it
         ends, so anybody who walked up mid-match read the empty list and had
         nothing to tap until it did.

         Inside the growing box and not beside it: two `.stack`s split the
         slack between them, which left this one adrift in the middle of an
         empty page and pressed against the standings button at the bottom. -->
    <div id="open-room">
      <span class="eyebrow">Or start your own</span>
      <div class="modes">
        <button class="btn ghost" type="button" data-mode="solo">
          <b>Score attack</b><span>You against the house side</span>
        </button>
        <button class="btn ghost" type="button" data-mode="versus">
          <b>Head to head</b><span>Bring somebody with the code</span>
        </button>
      </div>
    </div>
  </div>

  <a class="btn ghost push" href="/board">See the standings</a>
</div>
<script type="module" src="/static/home.js"></script>
</body>
</html>
