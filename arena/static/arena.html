<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090e">
<title>Arena - Futsal WorldCup</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="big">
<main class="screen">
  <div class="screen-bar">
    <div class="screen-id">
      <!-- A letter to a <b>, so each can take its colour from the cycle in
           app.css. No whitespace between them: it would set the word apart. -->
      <h1 class="brand"><b>F</b><b>u</b><b>t</b><b>s</b><b>a</b><b>l</b> <b>W</b><b>o</b><b>r</b><b>l</b><b>d</b><b>C</b><b>u</b><b>p</b></h1>
      <span class="where" id="where">Arena</span>
      <!-- Which match is on centre court. Every other match in the venue wears
           its code on its tile, and the strip leaves out the one that is big,
           so without this the match filling the wall is the only one in the
           building that goes unnamed. Written by `cutTo`, and gone with the
           football: in the lobby there is no match to name and the join card
           carries this room's code at ten times the size. -->
      <span class="on-air" id="on-air" hidden><i>On air</i><b id="on-air-code"></b></span>
    </div>
    <div class="bar-right">
      <!-- The screen guessed a mode when it opened this room, before anybody
           had walked up to it. This is how it changes its mind. -->
      <!-- A manager in the queue has asked for the other mode. Only ever shown
           beside a switch somebody can actually press: the ask is addressed to
           whoever is standing at this screen. -->
      <span class="ask" id="ask" role="status" hidden></span>
      <div class="mode-switch" id="mode-switch" role="group"
           aria-label="What this room plays" hidden>
        <button class="mode-pick" type="button" id="mode-solo" aria-pressed="true">Solo</button>
        <button class="mode-pick" type="button" id="mode-versus"
                aria-pressed="false">Head to head</button>
      </div>
      <button class="btn ghost slim" id="again" type="button" hidden>New room</button>
      <!-- A button rather than a label, because it is the only way back. A pin
           puts its match on centre court and centre court is the one room the
           strip leaves out, so there is no tile left to click a second time,
           and a screen on a wall has no Escape key to fall back on. -->
      <button class="dir-chip" id="director" type="button" disabled hidden
      ><i></i><span id="directing">Auto</span><b class="dir-off" aria-hidden="true">✕</b></button>
    </div>
  </div>

  <p class="problem" id="problem" hidden></p>

  <!-- Before the whistle: how to get in, who already is, and the standings
       for everyone walking past in the meantime -->
  <div class="lobby-grid" id="lobby" hidden>
    <div class="pitch-stack">
      <div class="lobby-badge"><i></i><span id="badge">Waiting for a manager</span></div>
      <div class="seats" id="seats"></div>
      <iframe class="board-frame" id="board" title="The standings" loading="lazy"></iframe>
    </div>

    <!-- The heading, the blurb and the code under the QR all describe whichever
         code is in it, and that is not always this room's: a room that has
         finished cannot be walked into, and its own code answers "that room is
         closed" to anybody who scans it. `lobbyWayIn` swaps all four together. -->
    <aside class="join-card">
      <h2 id="join-head">Scan to play</h2>
      <p id="join-blurb">Your phone becomes the dugout. Talk to the squad; they decide how to play it.</p>
      <div class="qr" id="qr"></div>
      <div class="or-code" id="or-code">
        <span class="eyebrow">Or open</span>
        <b id="code-2">····</b>
        <em id="join-url">/join</em>
      </div>
    </aside>
  </div>

  <!-- After it: the match at the size of the room, and both relays beside it -->
  <div class="court-grid" id="court" hidden>
    <div class="court">
      <!-- One canvas, mounted once, pointed at whichever match is on. Empty
           here: /pitch/viewer.js fills it, and until it has there is nothing
           to draw. -->
      <div class="court-frame" id="pitch" data-waiting="true"></div>
    </div>

    <aside class="rail">
      <section class="relay rail-feed b">
        <div class="relay-hd">
          <span class="eyebrow">Blue dugout</span>
          <span class="elapsed" id="who-blue"></span>
        </div>
        <div class="relay-scroll" id="relay-blue"></div>
      </section>

      <section class="relay rail-feed r">
        <div class="relay-hd">
          <span class="eyebrow">Red dugout</span>
          <span class="elapsed" id="who-red"></span>
        </div>
        <div class="relay-scroll" id="relay-red"></div>
      </section>

      <!-- Football is on the screen, so the lobby card that carries the way in
           has gone, and this has to carry it instead. Both halves are written
           by `wayIn` in arena.js, which decides *which* code belongs here:
           this room's while this room can still be walked into, and the
           venue's the moment its dugouts are full. A code offering a match
           that has already kicked off is a worse answer than no code. -->
      <div class="join-mini" id="join-mini" hidden>
        <div class="qr" id="qr-mini"></div>
        <div>
          <span class="eyebrow" id="way-in">Start a match here</span>
          <b id="code-3">····</b>
        </div>
      </div>
    </aside>
  </div>

  <!-- Always: what else is going on right now -->
  <section class="wall" id="wall">
    <div class="wall-hd">
      <!-- How many, from whichever page is up. The tiles are numbered along the
           whole strip, so this is also the last number on the last page. Inside
           the heading rather than beside it: it is part of what the heading
           says, and the row below spaces its children apart. -->
      <span class="eyebrow">Also on now <b class="wall-count" id="wall-count"
                                           hidden>0</b></span>
      <!-- Filled in by the wall, and only there when there is a second page. -->
      <nav class="pages" id="pages" aria-label="Pages of matches" hidden></nav>
      <span class="wall-hint" id="wall-hint">Click a match to put it on the big
        screen · the chip above hands it back</span>
    </div>
    <div class="wall-strip" id="tiles"></div>
  </section>
</main>
<script type="module" src="/static/arena.js"></script>
</body>
</html>
