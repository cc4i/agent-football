<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<title>Your dugout - Futsal WorldCup</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="phone fixed">
<main class="pscreen">
  <div class="pbar">
    <span class="code" id="code">····</span>
    <span class="side-chip idle" id="side">Connecting</span>
  </div>

  <p class="problem" id="problem" hidden></p>

  <!-- Before the whistle -->
  <section class="stack" id="lobby" hidden>
    <h1 class="ptitle" id="lobby-title">Ready when they are</h1>
    <p class="psub" id="lobby-sub">Once both dugouts are ready, either of you can kick off.</p>

    <!-- Where to look, not what runs it. The venue plays the match now, so the
         big screen is somewhere to watch it rather than the thing holding it
         up. Hidden along with the button when the room shuts before it starts:
         there is no match coming, and no score with it. -->
    <div class="banner info" id="how">
      <span class="ico" aria-hidden="true">🖥️</span>
      <div><b>Watch it on the big screen</b>Your phone stays on for the dugout and the score.</div>
    </div>

    <div class="mini-board" id="seats"></div>

    <button class="btn go push" id="go" type="button" disabled>Ready</button>

    <!-- The way out of a room that shut before it started, in place of the
         button above. The phone holding this page already knows who its
         manager is and the rooms still open are one tap away, so sending them
         off to hunt for a code on a wall would be the arena forgetting that. -->
    <a class="btn ghost push" id="elsewhere" href="/home" hidden>Find another room</a>
  </section>

  <!-- After it -->
  <section class="stack" id="live" hidden>
    <div class="ft-badge" id="ft" hidden>Full time</div>

    <div class="pscore">
      <span class="t"><i class="pdot b"></i><span id="score-blue">0</span></span>
      <span class="clk" id="clock">03:00</span>
      <span class="t"><span id="score-red">0</span><i class="pdot r"></i></span>
    </div>

    <div class="mini" id="mini">
      <div class="pitch-lines"></div>
      <span class="mini-tag" id="mini-tag">LIVE</span>
    </div>

    <div class="prelay">
      <div class="relay">
        <div class="relay-hd">
          <span class="eyebrow">Relay</span>
          <span class="elapsed" id="elapsed"></span>
        </div>
        <div class="relay-scroll" id="relay"></div>
      </div>
    </div>

    <div class="composer" id="composer">
      <div class="queued" id="queued" hidden></div>
      <div class="shout-row">
        <!-- 200 is the arena's own limit on a shout, so the keyboard stops at
             the same place the server would. -->
        <input class="input" id="shout" type="text" maxlength="200"
               autocomplete="off" autocapitalize="sentences" enterkeyhint="send"
               aria-label="Say something to the squad"
               placeholder="Say something to the squad">
        <button id="send" type="button">Shout</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <!-- What it was worth. Every number here was computed by the arena from the
       match's own log, breakdown included, so the sum on this screen and the
       total on the board cannot come apart. -->
  <section class="stack sheet" id="result" hidden>
    <div class="ft-badge">Full time</div>

    <div class="total">
      <span class="eyebrow" id="r-mode">Score attack</span>
      <div class="pts" id="r-points">0</div>
      <div class="rank" id="r-rank"></div>
      <div class="breakdown" id="r-breakdown"></div>
    </div>

    <div class="mini-board" id="r-top"></div>
    <p class="hint" id="r-hint"></p>

    <div class="after">
      <a class="btn ghost" href="/board">See the full board</a>
    </div>
  </section>
</main>
<script type="module" src="/static/play.js"></script>
</body>
</html>
